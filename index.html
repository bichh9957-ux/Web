<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#0f111a;
  --forest:#2d7d46;
  --neon:#57f287;
  --lime:#b9ff7a;
  --cyan:#3df0ff;
  --mag:#ff2ea6;
  --link:#00b0f4;
  --ink:#e8f3ec;
  --soft:#cfe4d6;
  --muted:#8ea799;
  --line:rgba(87,242,135,.18);
  --st:#3ddc84;                       /* màu trạng thái (online) */

  --f-display:'Chakra Petch','Segoe UI',system-ui,sans-serif,'Cambria Math','Noto Sans Math','Segoe UI Symbol';
  --f-serif:'Cormorant Garamond','Palatino Linotype',Georgia,serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
body[data-status="idle"]{--st:#f0b232}
body[data-status="dnd"]{--st:#f23f43}
body[data-status="offline"]{--st:#80848e}

@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{
  min-height:100vh;min-height:100svh;
  display:grid;place-items:center;
  padding:clamp(14px,4vw,48px) clamp(12px,3vw,28px);
  color:var(--ink);background:var(--bg);
  font-family:var(--f-display);
  overflow-x:hidden;position:relative;
}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--neon);outline-offset:3px;border-radius:8px}

/* nền: ánh rừng + vệt đỏ tím rất nhẹ ở góc dưới (theme của profile Discord) */
body::before{
  content:'';position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(900px 620px at 12% -8%,rgba(45,125,70,.40),transparent 62%),
    radial-gradient(700px 520px at 105% 105%,rgba(255,46,166,.11),transparent 62%),
    radial-gradient(620px 420px at 50% 125%,rgba(45,125,70,.22),transparent 62%),
    var(--bg);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-image:
    linear-gradient(rgba(87,242,135,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(87,242,135,.035) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 10%,transparent 72%);
          mask-image:radial-gradient(ellipse at 50% 40%,#000 10%,transparent 72%);
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}

/* ============================================================
   MAIN CARD — glassmorphism, viền xanh lá mờ
   ============================================================ */
.card{
  position:relative;width:min(940px,100%);
  display:grid;gap:clamp(14px,2.4vw,22px);
  padding:clamp(20px,4vw,44px);
  border-radius:clamp(26px,4vw,38px);
  background:
    radial-gradient(120% 80% at 0% 0%,rgba(45,125,70,.24),transparent 55%),
    radial-gradient(90% 60% at 100% 100%,rgba(255,46,166,.075),transparent 62%),
    linear-gradient(160deg,rgba(18,30,25,.62),rgba(10,13,19,.74));
  -webkit-backdrop-filter:blur(24px) saturate(150%);
          backdrop-filter:blur(24px) saturate(150%);
  border:1px solid rgba(87,242,135,.22);
  box-shadow:
    0 40px 100px -30px #000,
    0 0 90px -34px rgba(45,125,70,.9),
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 0 70px rgba(45,125,70,.06);
}
.card>*{min-width:0}
/* vệt sáng dưới đáy card, giống losxtriz.xyz */
.card::after{
  content:'';position:absolute;left:14%;right:14%;bottom:-1px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,rgba(185,255,122,.95),transparent);
  opacity:.8;pointer-events:none;
}

/* một nhịp xuất hiện duy nhất khi tải trang */
.reveal{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*110ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

/* ============================================================
   HERO
   ============================================================ */
.hero{
  position:relative;
  display:grid;grid-template-columns:minmax(0,1fr) 260px;
  gap:clamp(12px,3vw,32px);align-items:center;
}
.hero-text{position:relative;z-index:4;display:grid;gap:14px;justify-items:start}

.name-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.name{
  font-weight:700;letter-spacing:.01em;line-height:1.05;
  font-size:clamp(2.2rem,6.4vw,3.8rem);
  background:linear-gradient(96deg,#d8ffe5 0%,#57f287 46%,#2fd172 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(87,242,135,.42));
}

/* dàn badges dạng viên thuốc */
.badges{
  list-style:none;display:flex;gap:2px;padding:5px 8px;border-radius:999px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  box-shadow:inset 0 0 18px rgba(87,242,135,.07);
}
.badges li{
  width:30px;height:30px;display:grid;place-items:center;border-radius:50%;
  font-size:17px;cursor:default;position:relative;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s;
}
.badges li:hover{background:rgba(87,242,135,.16);transform:translateY(-3px) scale(1.14)}

[data-tip]{position:relative}
[data-tip]::after{
  content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 9px);
  transform:translate(-50%,4px);white-space:nowrap;pointer-events:none;z-index:30;
  padding:4px 10px;border-radius:8px;background:#0b140f;border:1px solid var(--line);
  font:500 .72rem var(--f-mono);color:var(--ink);opacity:0;transition:opacity .2s,transform .2s;
}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0)}

.handle{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font:500 .95rem var(--f-mono);color:var(--muted)}
.handle b{font-weight:500;color:var(--ink)}
.handle .sep{opacity:.35}
.tag{
  display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:8px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);
  font:600 .8rem var(--f-display);letter-spacing:.05em;color:var(--ink);
  transition:border-color .25s,box-shadow .25s;
}
.tag:hover{border-color:rgba(255,228,94,.5);box-shadow:0 0 16px -4px rgba(255,228,94,.5)}

.bio{
  font-family:var(--f-serif);font-style:italic;font-weight:500;
  font-size:clamp(1.18rem,2.7vw,1.55rem);line-height:1.5;color:var(--soft);
  max-width:34ch;min-height:3em;
}
.bio a{
  color:var(--link);text-decoration:none;overflow-wrap:anywhere;
  background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;
  transition:background-size .35s ease,text-shadow .3s;
}
.bio a:hover{background-size:100% 1px;text-shadow:0 0 14px rgba(0,176,244,.5)}
.caret{display:inline-block;width:2px;height:1.05em;margin-left:3px;vertical-align:-.16em;background:var(--neon);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.links{display:flex;flex-wrap:wrap;gap:10px}
.ico{
  width:46px;height:46px;display:grid;place-items:center;cursor:pointer;text-decoration:none;
  border-radius:14px;color:var(--soft);background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);
  transition:transform .3s cubic-bezier(.2,.8,.2,1),background .25s,color .25s,box-shadow .3s,border-color .25s;
}
.ico svg{width:22px;height:22px;fill:currentColor}
.ico svg.s,.since svg,.foot svg.s{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico:hover{
  transform:translateY(-4px);color:#05140b;background:var(--neon);border-color:transparent;
  box-shadow:0 12px 30px -8px rgba(87,242,135,.75);
}
.since{display:flex;align-items:center;gap:8px;font:400 .82rem var(--f-mono);color:var(--muted)}
.since svg{width:15px;height:15px}

/* ---------- khung ảnh đại diện + quỹ đạo elip ---------- */
.hero-art{position:relative;z-index:2;width:100%;max-width:260px;aspect-ratio:1;justify-self:center;perspective:900px}

.frame{
  position:absolute;inset:0;z-index:2;overflow:hidden;border-radius:46px;
  border:1px solid rgba(87,242,135,.38);
  background:#0a1a10;
  box-shadow:0 24px 60px -16px rgba(0,0,0,.85),0 0 44px -8px rgba(87,242,135,.42),inset 0 0 0 1px rgba(255,255,255,.05);
  transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;
  will-change:transform;
}
.hero-art:hover .frame{box-shadow:0 30px 70px -16px rgba(0,0,0,.9),0 0 64px -6px rgba(87,242,135,.6),inset 0 0 0 1px rgba(255,255,255,.08)}

/* banner rừng: ảnh (nếu tải được) phủ lên nền rừng + tia nắng vẽ bằng CSS */
.forest{
  position:absolute;inset:0;
  background:
    var(--banner,linear-gradient(transparent,transparent)) center/cover no-repeat,
    radial-gradient(60% 46% at 72% 6%,rgba(255,247,190,.6),transparent 70%),
    repeating-linear-gradient(100deg,rgba(8,52,22,0) 0 16px,rgba(7,44,19,.6) 16px 25px,rgba(8,52,22,0) 25px 46px),
    linear-gradient(180deg,#1f7a39 0%,#0f4122 52%,#07170e 100%);
}
.forest::before{ /* tia nắng xuyên lá */
  content:'';position:absolute;inset:0;mix-blend-mode:screen;opacity:.85;
  background:conic-gradient(from 158deg at 76% -12%,transparent 0 7%,rgba(255,250,200,.34) 9.5%,transparent 13%,rgba(255,250,200,.22) 17%,transparent 21%,rgba(255,250,200,.2) 27%,transparent 33%,transparent 100%);
  animation:sway 9s ease-in-out infinite alternate;
}
@keyframes sway{from{opacity:.55;transform:rotate(-2deg) scale(1.04)}to{opacity:.95;transform:rotate(2deg) scale(1.08)}}
.forest::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(10,70,30,.22),rgba(5,16,9,.12) 38%,rgba(4,12,7,.78));
}

.online-tag{
  position:absolute;left:50%;top:13px;transform:translateX(-50%);z-index:5;
  padding:4px 14px;border-radius:99px;font:500 .66rem var(--f-mono);letter-spacing:.2em;color:#fff;
  background:linear-gradient(90deg,rgba(87,242,135,.3),rgba(255,46,166,.42));
  border:1px solid rgba(255,255,255,.22);box-shadow:0 0 16px rgba(255,46,166,.35);
}

.avatar{position:absolute;left:50%;top:56%;width:80%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:3}
.av-ring{
  position:absolute;inset:15.5%;border-radius:50%;
  background:conic-gradient(from var(--a),#57f287,#3df0ff,#b9ff7a,#57f287);
  animation:spinA 7s linear infinite;
  filter:drop-shadow(0 0 10px rgba(87,242,135,.75));
}
@keyframes spinA{to{--a:360deg}}
.av-core{position:absolute;inset:18%;border-radius:50%;overflow:hidden;background:#0b140f}
.av-core img,.av-core svg{display:block;width:100%;height:100%;object-fit:cover}
.deco{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 5px rgba(87,242,135,.85))}

.dot{position:absolute;border-radius:50%;background:var(--st);box-shadow:0 0 0 3px #0d1712}
.dot::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--st);animation:ping 2.2s ease-out infinite}
@keyframes ping{from{opacity:.75;transform:scale(.8)}to{opacity:0;transform:scale(1.8)}}
.avatar .dot{right:19%;bottom:19%;width:12%;aspect-ratio:1}

.orbit{
  position:absolute;left:50%;top:50%;pointer-events:none;overflow:visible;
  width:min(600px,calc(100vw - 24px));aspect-ratio:600/240;
  transform:translate(-50%,-50%) rotate(-17deg);
  filter:drop-shadow(0 0 6px rgba(87,242,135,.5));
}
.orbit-back{z-index:1}
.orbit-front{z-index:3}
.orbit ellipse{fill:none}
.orbit .comet{stroke-linecap:round;animation:comet 7s linear infinite}
.orbit .c1{stroke:#e2ffec;stroke-width:2.6;stroke-dasharray:190 1034}
.orbit .c2{stroke:var(--lime);stroke-width:2;stroke-dasharray:110 1007;animation-duration:9s;animation-direction:reverse}
@keyframes comet{to{stroke-dashoffset:-1224}}

/* ============================================================
   TILES (trạng thái + server)
   ============================================================ */
.mid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,20px)}
.tile,.player{
  position:relative;border-radius:24px;
  background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.014));
  border:1px solid rgba(255,255,255,.075);
  transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .35s;
}
.tile{display:flex;align-items:center;gap:16px;padding:18px 20px}
.tile:hover,.player:hover{border-color:rgba(87,242,135,.42);box-shadow:0 20px 44px -20px rgba(87,242,135,.5)}
.tile:hover{transform:translateY(-4px)}

.mini-av{position:relative;flex:none;width:64px;height:64px}
.mini-core{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#0b140f;box-shadow:0 0 0 2px rgba(87,242,135,.55),0 0 22px -4px rgba(87,242,135,.5)}
.mini-core img,.mini-core svg{display:block;width:100%;height:100%;object-fit:cover}
.mini-av .dot{right:-2px;bottom:-2px;width:19px;height:19px;box-shadow:0 0 0 3px #0f1914}

.tile-txt{display:grid;gap:4px;min-width:0}
.tile-txt strong{font:600 1.15rem var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:flex;align-items:center;gap:8px;font:500 .84rem var(--f-mono);color:var(--st)}
.st::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--st);box-shadow:0 0 9px var(--st)}

.srv-ico{
  flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;overflow:hidden;font-size:28px;
  background:radial-gradient(circle at 30% 20%,#57f287,#1c6a3a 60%,#0b2a17);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.2),0 0 24px -4px rgba(87,242,135,.55);
}
.srv-ico img{width:100%;height:100%;object-fit:cover;display:block}
.srv-txt{display:grid;gap:5px;min-width:0;flex:1}
.srv-txt strong{font:600 1.08rem var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;flex-wrap:wrap;gap:3px 12px;font:400 .74rem var(--f-mono);color:var(--muted)}
.stats span{display:inline-flex;align-items:center;gap:6px}
.pip{width:7px;height:7px;border-radius:50%;background:#80848e}
.pip.on{background:var(--st);box-shadow:0 0 8px var(--st)}

.join{
  position:relative;flex:none;overflow:hidden;text-decoration:none;
  padding:9px 20px;border-radius:12px;font:700 .82rem var(--f-display);letter-spacing:.04em;color:#eafff1;
  background:linear-gradient(135deg,#2faa5c,#1d7440);border:1px solid rgba(255,255,255,.2);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,filter .25s;
}
.join::before{
  content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);transition:left .55s ease;
}
.join:hover{transform:translateY(-2px);filter:brightness(1.12);box-shadow:0 10px 26px -6px rgba(87,242,135,.7)}
.join:hover::before{left:130%}

/* ============================================================
   MUSIC PLAYER
   ============================================================ */
.player{display:grid;gap:14px;padding:20px clamp(16px,3vw,28px) 22px}
.p-title{text-align:center;font:italic 600 1.4rem var(--f-serif);letter-spacing:.02em;color:#e7f6ec}
.p-title small{display:block;margin-top:2px;font:400 .72rem var(--f-mono);font-style:normal;letter-spacing:.06em;color:var(--muted)}
.p-main{display:grid;grid-template-columns:auto 1fr;gap:clamp(14px,2.4vw,24px);align-items:center}

.vinyl{
  position:relative;width:92px;aspect-ratio:1;border-radius:50%;flex:none;
  background:
    radial-gradient(circle,#0b140f 0 7%,#57f287 8% 23%,#0b140f 24% 28%,transparent 29%),
    conic-gradient(from 20deg,rgba(255,255,255,.17),transparent 18%,transparent 48%,rgba(255,255,255,.14) 58%,transparent 72%),
    repeating-radial-gradient(circle,#07090c 0 2px,#12171d 2px 3.5px);
  box-shadow:0 12px 30px -8px rgba(0,0,0,.85),0 0 0 2px rgba(255,255,255,.05),0 0 30px -6px rgba(87,242,135,.4);
  animation:spin 6s linear infinite paused;
  transition:box-shadow .4s;
}
.vinyl::after{content:'🐢';position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.playing .vinyl{animation-play-state:running;box-shadow:0 12px 30px -8px rgba(0,0,0,.85),0 0 0 2px rgba(87,242,135,.3),0 0 40px -4px rgba(87,242,135,.65)}
@keyframes spin{to{transform:rotate(360deg)}}

.p-ui{display:grid;gap:10px;min-width:0}
.timeline{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;font:400 .72rem var(--f-mono);color:var(--muted)}
.bar{position:relative;height:20px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.bar.live{cursor:default}
.bar::before{content:'';position:absolute;left:0;right:0;height:3px;border-radius:3px;background:rgba(255,255,255,.13)}
.fill{position:absolute;left:0;height:3px;width:0;border-radius:3px;background:linear-gradient(90deg,#2d7d46,#57f287);box-shadow:0 0 10px rgba(87,242,135,.6)}
.knob{position:absolute;left:0;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--neon);transform:translateX(-50%) scale(0);transition:transform .2s}
.bar:not(.live):hover .knob,.bar.drag .knob,.bar:focus-visible .knob{transform:translateX(-50%) scale(1)}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.transport{display:flex;align-items:center;gap:10px}
.cbtn{
  width:40px;height:40px;display:grid;place-items:center;cursor:pointer;border-radius:50%;
  color:#d9eadf;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s,box-shadow .25s;
}
.cbtn svg{width:17px;height:17px;fill:currentColor}
.cbtn:hover{transform:scale(1.1);background:rgba(87,242,135,.18)}
.cbtn:active{transform:scale(.93)}
.cbtn.main{
  width:54px;height:54px;color:#04110a;border-color:transparent;
  background:radial-gradient(circle at 30% 20%,#7bffa6,#2d7d46);
  box-shadow:0 8px 26px -6px rgba(87,242,135,.75);
}
.cbtn.main svg{width:20px;height:20px}
.cbtn.main:hover{background:radial-gradient(circle at 30% 20%,#a4ffc2,#33904f);box-shadow:0 12px 32px -6px rgba(87,242,135,.95)}
.i-pause{display:none}
.playing .i-play{display:none}
.playing .i-pause{display:block}

.vol{display:flex;align-items:center;gap:10px;flex:1;min-width:130px;color:var(--muted)}
.vol svg{width:18px;height:18px;flex:none}
.vol input{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer}
.vol input::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--neon) var(--v,70%),rgba(255,255,255,.14) var(--v,70%))}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4.5px;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--neon)}
.vol input::-moz-range-track{height:3px;border-radius:3px;background:rgba(255,255,255,.14)}
.vol input::-moz-range-progress{height:3px;border-radius:3px;background:var(--neon)}
.vol input::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 10px var(--neon)}

.eq{display:flex;align-items:flex-end;gap:3px;height:20px}
.eq i{width:3px;height:100%;border-radius:2px;background:var(--neon);transform-origin:bottom;transform:scaleY(.2);animation:eq 1s ease-in-out infinite paused}
.eq i:nth-child(2){animation-duration:.75s;animation-delay:-.3s}
.eq i:nth-child(3){animation-duration:1.15s;animation-delay:-.6s}
.eq i:nth-child(4){animation-duration:.9s;animation-delay:-.15s}
.playing .eq i{animation-play-state:running}
@keyframes eq{50%{transform:scaleY(1)}}

/* ============================================================
   FOOTER
   ============================================================ */
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;padding:2px 6px 0;font:400 .8rem var(--f-mono);color:var(--muted)}
.foot span{display:inline-flex;align-items:center;gap:8px}
.foot svg{width:14px;height:14px}
.foot .r{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.foot .r .div{width:1px;height:14px;background:rgba(255,255,255,.14)}
#clock{font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:50;
  transform:translate(-50%,20px);opacity:0;pointer-events:none;max-width:calc(100vw - 32px);
  padding:10px 18px;border-radius:12px;font:500 .84rem var(--f-display);color:var(--ink);
  background:rgba(11,20,15,.92);border:1px solid var(--line);box-shadow:0 14px 40px -10px #000,0 0 24px -8px rgba(87,242,135,.5);
  transition:opacity .3s,transform .3s cubic-bezier(.2,.8,.2,1);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:780px){
  .hero{grid-template-columns:1fr}
  .hero-art{order:-1;max-width:230px}
  .hero-text{justify-items:center;text-align:center}
  .name-row,.handle,.links,.since{justify-content:center}

  .controls{justify-content:center}
  .vol{flex:1 1 100%}
}
@media (max-width:420px){
  .tile{padding:16px}
  .join{padding:9px 16px}
  .foot{justify-content:center}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .eq i{transform:scaleY(.5)}
}

<script>
(() => {
'use strict';

/* ============================================================
   CẤU HÌNH — chỉnh ở đây là đủ
   ============================================================ */
const CONFIG = {
  username   : 'carlbot1632',
  inviteCode : 't2qmbTBrQz',            // mã invite server Ma Sói (phân biệt hoa/thường)
  status     : 'online',                // online | idle | dnd | offline
  discordId  : '1220291333982257255',                      // (tuỳ chọn) ID Discord để tự cập nhật trạng thái qua Lanyard
  website    : '',                      // (tuỳ chọn) link web riêng; để trống = nút Web sẽ sao chép link trang này
  location   : 'Việt Nam',
  timezone   : 'Asia/Ho_Chi_Minh',
  avatarUrl  : 'https://cdn.discordapp.com/avatars/1220291333982257255/a_f8ae12a398e5d2ae2cd88cbaffa65af7.gif?size=256',
  bannerUrl  : 'https://images.unsplash.com/photo-1511497584788-876761102346?w=900&q=80',
  // Thêm nhạc của bạn (file .mp3/.ogg cùng thư mục hoặc link trực tiếp). Bài đặt ở đây sẽ phát trước nhạc tích hợp.
  tracks     : [
    // { title: 'Tên bài', artist: 'Nghệ sĩ', src: 'music/lofi.mp3' },
  ],
};

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep  = ms => new Promise(r => setTimeout(r, ms));
const clamp  = (v, a, b) => Math.min(b, Math.max(a, v));

/* ---------- toast + clipboard ---------- */
const $toast = $('#toast'); let toastT;
function toast(msg){
  $toast.textContent = msg; $toast.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => $toast.classList.remove('show'), 2400);
}
async function copy(text, okMsg){
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch { toast('Không sao chép được — ' + text); }
}

/* ============================================================
   ÁP DỤNG CẤU HÌNH
   ============================================================ */
const inviteUrl = `https://discord.gg/${CONFIG.inviteCode}`;
$('#bioLink').href = inviteUrl; $('#bioLink').textContent = inviteUrl;
$('#joinBtn').href = inviteUrl; $('#srvLink').href = inviteUrl;
$('#loc').textContent = CONFIG.location;
if (CONFIG.bannerUrl) $('#forest').style.setProperty('--banner', `url("${CONFIG.bannerUrl}")`);

const STATUS_TEXT = { online:'Online', idle:'Vắng mặt', dnd:'Đừng làm phiền', offline:'Offline' };
function setStatus(s){
  if (!STATUS_TEXT[s]) return;
  document.body.dataset.status = s; $('#stText').textContent = STATUS_TEXT[s];
}
setStatus(CONFIG.status);

/* avatar thật (nếu tải được thì thay hình rùa vẽ sẵn) */
if (CONFIG.avatarUrl){
  const im = new Image(); im.alt = 'Avatar của Rùa'; im.decoding = 'async'; im.referrerPolicy = 'no-referrer';
  im.onload = () => $$('.av-slot').forEach(slot => slot.replaceChildren(im.cloneNode()));
  im.src = CONFIG.avatarUrl;
}

/* nút icon */
$('#btnDiscord').addEventListener('click', () => copy(CONFIG.username, `Đã sao chép: ${CONFIG.username}`));
const $web = $('#btnWeb');
if (CONFIG.website){
  $web.href = CONFIG.website; $web.target = '_blank'; $web.rel = 'noopener noreferrer'; $web.dataset.tip = 'Trang web';
} else {
  $web.addEventListener('click', e => { e.preventDefault(); copy(location.href, 'Đã sao chép link trang'); });
}

/* ============================================================
   TRẠNG THÁI DISCORD (Lanyard — tuỳ chọn)
   ============================================================ */
async function lanyard(){
  try {
    const r = await fetch(`https://api.lanyard.rest/v0/users/${CONFIG.discordId}`);
    const j = await r.json();
    if (j.success) setStatus(j.data.discord_status);
  } catch {}
}
if (CONFIG.discordId){ lanyard(); setInterval(lanyard, 30000); }

/* ============================================================
   SERVER MA SÓI — lấy tên, icon, số thành viên từ invite
   ============================================================ */
(async function loadServer(){
  try {
    const r = await fetch(`https://discord.com/api/v9/invites/${encodeURIComponent(CONFIG.inviteCode)}?with_counts=true`);
    if (!r.ok) throw new Error(r.status);
    const d = await r.json(), g = d.guild || {};
    if (g.name) $('#srvName').textContent = g.name;
    if (g.id && g.icon){
      const im = new Image(); im.alt = '';
      im.onload = () => $('#srvIco').replaceChildren(im);
      im.src = `https://cdn.discordapp.com/icons/${g.id}/${g.icon}.png?size=128`;
    }
    const nf = new Intl.NumberFormat('vi-VN');
    if (Number.isFinite(d.approximate_member_count)){
      const on = Number.isFinite(d.approximate_presence_count) ? `<span><i class="pip on"></i>${nf.format(d.approximate_presence_count)} Online</span>` : '';
      $('#srvStats').innerHTML = `${on}<span><i class="pip"></i>${nf.format(d.approximate_member_count)} Members</span>`;
    }
  } catch { /* giữ nguyên dòng mô tả mặc định */ }
})();

/* ============================================================
   BIO — gõ chữ
   ============================================================ */
(async function typeBio(){
  if (reduce) return;
  const a = $('#bioText'), l = $('#bioLink');
  const t1 = a.textContent, t2 = l.textContent;
  a.textContent = ''; l.textContent = '';
  await sleep(700);
  for (const ch of t1){ a.textContent += ch; await sleep(30); }
  for (const ch of t2){ l.textContent += ch; await sleep(16); }
})();

/* ============================================================
   ĐỒNG HỒ + LƯỢT XEM
   ============================================================ */
(function clock(){
  let f;
  try { f = new Intl.DateTimeFormat('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23', timeZone:CONFIG.timezone }); }
  catch { f = new Intl.DateTimeFormat('en-GB', { hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23' }); }
  const el = $('#clock');
  const tick = () => { el.textContent = f.format(new Date()); };
  tick(); setInterval(tick, 1000);
})();

(function views(){
  /* Đếm theo trình duyệt (localStorage). Muốn số lượt xem thật cho mọi người, thay bằng API của dịch vụ đếm bạn dùng. */
  let n = 0;
  try {
    n = parseInt(localStorage.getItem('rua_views') || '0', 10) || 0;
    if (!sessionStorage.getItem('rua_counted')){ n++; localStorage.setItem('rua_views', n); sessionStorage.setItem('rua_counted', '1'); }
  } catch { n = 1; }
  $('#views').textContent = n >= 1000 ? (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : n;
})();

/* ============================================================
   HIỆU ỨNG: đom đóm (canvas) + nghiêng khung ảnh
   ============================================================ */
(function fireflies(){
  const cv = $('#fx'), c = cv.getContext('2d');
  let W, H, dpr, P = [];
  const COLORS = ['87,242,135','87,242,135','87,242,135','185,255,122','61,240,255'];
  function size(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = cv.width = Math.round(innerWidth * dpr); H = cv.height = Math.round(innerHeight * dpr);
    const n = Math.round(Math.min(52, innerWidth / 28));
    P = Array.from({ length:n }, () => ({
      x:Math.random()*W, y:Math.random()*H, r:(1 + Math.random()*2) * dpr,
      vx:(Math.random() - .5) * .25 * dpr, vy:-(.05 + Math.random()*.28) * dpr,
      ph:Math.random()*6.28, sp:.6 + Math.random()*1.3, c:COLORS[Math.floor(Math.random()*COLORS.length)],
    }));
  }
  function draw(ts){
    const t = ts / 1000;
    c.clearRect(0, 0, W, H);
    for (const p of P){
      if (!reduce){
        p.x += p.vx + Math.sin(t*p.sp + p.ph) * .25 * dpr; p.y += p.vy;
        if (p.y < -30) p.y = H + 30; if (p.x < -30) p.x = W + 30; if (p.x > W + 30) p.x = -30;
      }
      const a = .12 + .88 * Math.pow(Math.max(0, Math.sin(t*p.sp + p.ph)), 2);
      const g = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*7);
      g.addColorStop(0, `rgba(${p.c},${a})`); g.addColorStop(1, `rgba(${p.c},0)`);
      c.fillStyle = g; c.beginPath(); c.arc(p.x, p.y, p.r*7, 0, 6.2832); c.fill();
    }
  }
  function loop(ts){ if (!document.hidden) draw(ts); requestAnimationFrame(loop); }
  size(); addEventListener('resize', size);
  if (reduce) draw(0); else requestAnimationFrame(loop);
})();

(function tilt(){
  if (reduce || !matchMedia('(hover:hover)').matches) return;
  const art = $('#art'), frame = $('#frame');
  art.addEventListener('pointermove', e => {
    const r = art.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    frame.style.transform = `rotateY(${x*14}deg) rotateX(${-y*14}deg) scale(1.03)`;
  });
  art.addEventListener('pointerleave', () => { frame.style.transform = ''; });
})();

/* ============================================================
   NHẠC LOFI TÍCH HỢP (Web Audio) — luôn phát được, không cần file
   ============================================================ */
const PRESETS = [
  { title:'Rừng sau mưa', artist:'Lofi tích hợp · 72 BPM', bpm:72,
    chords:[{notes:[53,57,60,64],bass:38},{notes:[59,62,65,69],bass:43},{notes:[52,55,59,62],bass:36},{notes:[60,64,67,71],bass:45}],
    scale:[62,65,67,69,72,74,77] },
  { title:'Sương mai', artist:'Lofi tích hợp · 66 BPM', bpm:66,
    chords:[{notes:[53,57,60,64],bass:41},{notes:[52,55,59,62],bass:40},{notes:[53,57,60,65],bass:38},{notes:[52,55,59,64],bass:36}],
    scale:[60,62,64,67,69,72,74] },
  { title:'Đom đóm', artist:'Lofi tích hợp · 78 BPM', bpm:78,
    chords:[{notes:[55,60,64,67],bass:45},{notes:[57,60,64,67],bass:41},{notes:[52,55,59,62],bass:36},{notes:[59,62,64,69],bass:43}],
    scale:[57,60,62,64,67,69,72] },
];

const Synth = (() => {
  let ctx, master, lp, comp, fxIn, delay, noiseBuf, timer;
  let step = 0, nextTime = 0, t0 = 0, vol = .7, preset = null;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const eighth = () => 60 / preset.bpm / 2;

  function init(){
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error('Web Audio không được hỗ trợ');
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = vol * .9;
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -20; comp.ratio.value = 4; comp.attack.value = .01; comp.release.value = .25;
    lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3000; lp.Q.value = .6;
    lp.connect(comp); comp.connect(master); master.connect(ctx.destination);

    fxIn = ctx.createGain(); fxIn.connect(lp);                       // echo mơ màng cho giai điệu
    delay = ctx.createDelay(2);
    const fb = ctx.createGain(); fb.gain.value = .34;
    const wet = ctx.createGain(); wet.gain.value = .38;
    fxIn.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(lp);

    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

    const len = ctx.sampleRate * 4, cb = ctx.createBuffer(1, len, ctx.sampleRate), cd = cb.getChannelData(0);   // tiếng đĩa than
    for (let i = 0; i < len; i++) cd[i] = (Math.random() < .0006 ? (Math.random()*2 - 1) * .9 : 0) + (Math.random()*2 - 1) * .012;
    const cs = ctx.createBufferSource(); cs.buffer = cb; cs.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500;
    const cg = ctx.createGain(); cg.gain.value = .16;
    cs.connect(hp); hp.connect(cg); cg.connect(comp); cs.start();
    apply();
  }
  function apply(){
    if (!ctx || !preset) return;
    delay.delayTime.value = 60 / preset.bpm * .75;
    step = 0; nextTime = ctx.currentTime + .1; t0 = ctx.currentTime;
  }

  function note(f, t, dur, vel, type, dest, detune){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'triangle'; o.frequency.value = f; if (detune) o.detune.value = detune;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vel, t + .018);
    g.gain.exponentialRampToValueAtTime(Math.max(vel * .35, .0002), t + dur * .5);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(dest || lp);
    o.start(t); o.stop(t + dur + .05);
  }
  function noise(t, dur){
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    s.start(t, Math.random() * 1.5, dur + .05); return s;
  }
  function kick(t, v){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
    g.gain.setValueAtTime(.7 * v, t); g.gain.exponentialRampToValueAtTime(.001, t + .32);
    o.connect(g); g.connect(lp); o.start(t); o.stop(t + .35);
  }
  function snare(t, v){
    const s = noise(t, .2), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = .7;
    g.gain.setValueAtTime(.26 * v, t); g.gain.exponentialRampToValueAtTime(.001, t + .2);
    s.connect(f); f.connect(g); g.connect(lp);
    note(180, t, .12, .1 * v, 'triangle', lp);
  }
  function hat(t, v){
    const s = noise(t, .05), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = 'bandpass'; f.frequency.value = 6000; f.Q.value = .8;
    g.gain.setValueAtTime(.06 * v, t); g.gain.exponentialRampToValueAtTime(.001, t + .05);
    s.connect(f); f.connect(g); g.connect(comp);
  }

  function playStep(s, t){
    const sd = eighth(), ch = preset.chords[Math.floor(s / 16) % preset.chords.length];
    const cs = s % 16, bs = s % 8;

    const hits = { 0:1, 6:.62, 8:.8, 14:.5 };                         // đàn phím kiểu Rhodes
    if (hits[cs] !== undefined){
      ch.notes.forEach((m, k) => {
        const f = mtof(m), tt = t + k * .012, d = sd * (cs === 0 ? 6 : 3.2);
        note(f, tt, d, .045 * hits[cs], 'triangle', lp, k % 2 ? 6 : -6);
        note(f * 2, tt, sd * 1.5, .008 * hits[cs], 'sine', lp);
      });
    }
    if (cs === 0 || cs === 8 || cs === 14){                            // bass
      const d = sd * (cs === 14 ? 1.6 : 5), v = cs === 14 ? .15 : .22;
      note(mtof(ch.bass), t, d, v, 'sine', lp);
      note(mtof(ch.bass) * 2, t, d, v * .16, 'triangle', lp);
    }
    if (bs === 0 || bs === 5) kick(t, bs === 0 ? 1 : .7);
    if (bs === 2 || bs === 6) snare(t, .9);
    if (Math.random() > .12) hat(t, (s % 2 ? .5 : .8) * (.7 + Math.random() * .3));

    if ([2, 4, 7, 10, 12].includes(cs) && Math.random() < .32){        // giai điệu ngẫu hứng
      const f = mtof(preset.scale[Math.floor(Math.random() * preset.scale.length)]);
      note(f, t, sd * 3, .05, 'sine', fxIn);
      note(f, t, sd * 3, .028, 'triangle', lp);
    }
  }
  function tick(){
    if (!ctx || ctx.state !== 'running' || !preset) return;
    while (nextTime < ctx.currentTime + .5){
      const sd = eighth();
      playStep(step, nextTime + (step % 2 ? sd * .16 : 0));            // swing nhẹ
      nextTime += sd; step++;
    }
  }

  return {
    setPreset(p){ preset = p; apply(); },
    async play(){
      init();
      if (ctx.state !== 'running') await ctx.resume();
      if (!timer) timer = setInterval(tick, 100);
      tick();
    },
    pause(){ if (ctx && ctx.state === 'running') ctx.suspend(); },
    setVolume(v){ vol = v; if (master) master.gain.setTargetAtTime(v * .9, ctx.currentTime, .03); },
    time(){ return ctx ? Math.max(0, ctx.currentTime - t0) : 0; },
    loopPct(){
      if (!preset) return 0;
      const L = preset.chords.length * 16 * eighth();
      return (this.time() % L) / L;
    },
  };
})();

/* ============================================================
   TRÌNH PHÁT NHẠC
   ============================================================ */
const tracks = [
  ...CONFIG.tracks.map(t => ({ ...t })),
  ...PRESETS.map(p => ({ title:p.title, artist:p.artist, preset:p })),
];
const $player = $('#player'), $bar = $('#bar'), $fill = $('#fill'), $knob = $('#knob');
const $tCur = $('#tCur'), $tDur = $('#tDur'), $toggle = $('#toggle'), $vol = $('#vol');
const audio = new Audio(); audio.preload = 'none';
let idx = 0, playing = false, fails = 0, vol = .7, seeking = false;

const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function setPlaying(b){
  playing = b;
  $player.classList.toggle('playing', b);
  $toggle.setAttribute('aria-label', b ? 'Tạm dừng' : 'Phát nhạc');
}
function pauseAll(){ audio.pause(); Synth.pause(); setPlaying(false); }

function loadTrack(i, resume){
  pauseAll();
  idx = (i + tracks.length) % tracks.length;
  const t = tracks[idx];
  $('#pTitle').textContent = t.title;
  $('#pArtist').textContent = t.artist || '';
  $bar.classList.toggle('live', !t.src);
  if (t.src) audio.src = t.src; else Synth.setPreset(t.preset);
  updateTimeline();
  try { if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title:t.title, artist:t.artist || CONFIG.username }); } catch {}
  if (resume) play();
}

async function play(){
  const t = tracks[idx];
  try {
    if (t.src){ Synth.pause(); await audio.play(); }
    else { audio.pause(); await Synth.play(); }
    fails = 0; setPlaying(true);
  } catch (err){
    console.warn('[player]', err);
    if (t.src && fails < tracks.length){ fails++; toast('Không tải được file nhạc — chuyển bài khác'); loadTrack(idx + 1, true); }
    else toast('Trình duyệt chưa cho phát nhạc — nhấn Play lần nữa');
  }
}
const toggle = () => playing ? pauseAll() : play();

function updateTimeline(){
  const t = tracks[idx]; let cur = 0, pct = 0;
  if (t.src){
    const d = audio.duration; cur = audio.currentTime || 0;
    pct = isFinite(d) && d > 0 ? cur / d : 0;
    $tDur.textContent = isFinite(d) ? fmt(d) : '--:--';
  } else {
    cur = Synth.time(); pct = Synth.loopPct(); $tDur.textContent = 'LIVE';
  }
  $tCur.textContent = fmt(cur);
  $fill.style.width = $knob.style.left = (pct * 100).toFixed(2) + '%';
  $bar.setAttribute('aria-valuenow', Math.round(pct * 100));
}
setInterval(updateTimeline, 200);

$toggle.addEventListener('click', toggle);
$('#prev').addEventListener('click', () => loadTrack(idx - 1, playing));
$('#next').addEventListener('click', () => loadTrack(idx + 1, playing));
audio.addEventListener('ended', () => loadTrack(idx + 1, true));
audio.addEventListener('error', () => { if (playing && tracks[idx].src){ toast('File nhạc bị lỗi — chuyển bài khác'); loadTrack(idx + 1, true); } });

/* tua nhạc (chỉ với file nhạc; nhạc tích hợp phát liên tục) */
function seekTo(e){
  const t = tracks[idx]; if (!t.src || !isFinite(audio.duration)) return;
  const r = $bar.getBoundingClientRect();
  audio.currentTime = clamp((e.clientX - r.left) / r.width, 0, 1) * audio.duration; updateTimeline();
}
$bar.addEventListener('pointerdown', e => { seeking = true; $bar.setPointerCapture(e.pointerId); $bar.classList.add('drag'); seekTo(e); });
$bar.addEventListener('pointermove', e => { if (seeking) seekTo(e); });
['pointerup', 'pointercancel'].forEach(ev => $bar.addEventListener(ev, () => { seeking = false; $bar.classList.remove('drag'); }));
$bar.addEventListener('keydown', e => {
  if (!tracks[idx].src || !isFinite(audio.duration)) return;
  if (e.key === 'ArrowRight'){ audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); e.preventDefault(); }
  if (e.key === 'ArrowLeft'){ audio.currentTime = Math.max(0, audio.currentTime - 5); e.preventDefault(); }
});

/* âm lượng */
function applyVol(){
  vol = $vol.value / 100; audio.volume = vol; Synth.setVolume(vol);
  $vol.style.setProperty('--v', $vol.value + '%');
}
$vol.addEventListener('input', applyVol); applyVol();

/* điều khiển từ màn hình khoá / phím media */
try {
  if ('mediaSession' in navigator){
    navigator.mediaSession.setActionHandler('play', play);
    navigator.mediaSession.setActionHandler('pause', pauseAll);
    navigator.mediaSession.setActionHandler('previoustrack', () => loadTrack(idx - 1, playing));
    navigator.mediaSession.setActionHandler('nexttrack', () => loadTrack(idx + 1, playing));
  }
} catch {}

loadTrack(0, false);
})();
</script>
</body>
</html>
